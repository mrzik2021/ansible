#ansible playbook init cluster
- name: CLUSTER CREATION
  hosts: rhel-k8s-master1
  become: yes
  tasks:
    - name: initialize the cluster
      shell: |
              kubeadm reset -f
              kubeadm init --pod-network-cidr=10.18.0.0/16 --control-plane-endpoint "rhel-k8s-vip.compnete.local:6443" --upload-certs --cri-socket /run/crio/crio.sock --kubernetes-version 1.30.1 --skip-phases=addon/kube-proxy 2>&1 > /root/kubernetes_initialize.log
      # args:
      #   chdir: $HOME
      #   creates: cluster_initialized.txt

    - name: Get the token for joining the worker nodes
      shell: kubeadm token create  --print-join-command > /root/worker-join.sh

