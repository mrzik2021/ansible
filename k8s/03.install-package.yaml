#Ansible-playbook install k8s
---
- name: SOFTWARE PACKAGE CONFIGURATION
  hosts: "rhel-k8s-master, rhel-k8s-worker"
  remote_user: compnet
  become: yes
  become_method: sudo
  become_user: root
  gather_facts: yes
  connection: ssh
  vars:
    CRIO_VERSION: "1.30"
    KUBERNETES_VERSION: "1.30"
    
  tasks:
    - name: install iproute-tc
      yum:
        name: iproute-tc
        state: present

    - name: stop and disable rhel firewall
      systemd:
        name: firewalld
        state: stopped
        enabled: false

    - name: disable selinux
      shell: |
              sudo setenforce 0
              sudo sed -i 's/^SELINUX=enforcing$/SELINUX=permissive/' /etc/selinux/config

    - name: create k8s module
      file:
        path: "/etc/modules-load.d/k8s.conf"
        state: "touch"

    - name: Add configuration module for k8s
      blockinfile:
        path: "/etc/modules-load.d/k8s.conf"
        block: |
                overlay
                br_netfilter

    - name: load k8s module configuration
      shell: |
              sudo modprobe overlay
              sudo modprobe br_netfilter

    - name: Set system configurations for Kubernetes networking
      file:
        path: "/etc/sysctl.d/99-kubernetes-cri.conf"
        state: "touch"

    - name: Add conf for sysctl kubernetes
      blockinfile:
        path: "/etc/sysctl.d/99-kubernetes-cri.conf"
        block: |
                net.bridge.bridge-nf-call-iptables = 1
                net.ipv4.ip_forward = 1
                net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply new settings
      command: sudo sysctl --system

    - name: disable swap
      shell: |
              sudo swapoff -a
              sudo sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

    - name: remove existing installation
      yum:
        name:
            - kubeadm
            - kubectl
            - kubelet
            - kubernetes-cni
            - kube*
            - cri-o 
            - cri-tools
        state: absent

    - name: Add CRI-O Source Repository
      yum_repository:
        name: cri-o
        description: crio repository
        baseurl: https://download.opensuse.org/repositories/isv:/kubernetes:/addons:/cri-o:/stable:/v{{ CRIO_VERSION }}/rpm/
        enabled: true
        gpgcheck: true
        gpgkey: https://download.opensuse.org/repositories/isv:/kubernetes:/addons:/cri-o:/stable:/v{{ CRIO_VERSION }}/rpm/repodata/repomd.xml.key
 
    - name: Add k8s Source Repository
      yum_repository:
        name: Kubernetes
        description: kuberenetes repository
        baseurl: https://download.opensuse.org/repositories/isv:/kubernetes:/core:/stable:/v{{ KUBERNETES_VERSION }}/rpm/
        enabled: true
        gpgcheck: true
        gpgkey: https://download.opensuse.org/repositories/isv:/kubernetes:/core:/stable:/v{{ KUBERNETES_VERSION }}/rpm/repodata/repomd.xml.key


    - name: install CRI-O container runtime
      yum:
        name:
            - cri-o
            - cri-tools
            - libseccomp
            - runc
        state: present

    - name: install kubernetes orchestration
      yum:
        name:
             - kubelet
             - kubeadm
        state: present

    - name: Enable kubelet services but dont start yet
      systemd:
        name: kubelet
        enabled: true
        state: stopped

    - name: Enable and start crio services
      systemd:
        name: crio
        enabled: true
        state: started
